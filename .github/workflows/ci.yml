name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t devops-production-lab:${{ github.sha }} .

      - name: Verify Docker image
        run: docker image inspect devops-production-lab:${{ github.sha }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-production-lab:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Save scanned Docker image
        run: docker save devops-production-lab:${{ github.sha }} -o devops-production-lab.tar

      - name: Upload scanned Docker image
        uses: actions/upload-artifact@v4
        with:
          name: scanned-docker-image
          path: devops-production-lab.tar
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Docker image to GHCR
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download scanned Docker image
        uses: actions/download-artifact@v4
        with:
          name: scanned-docker-image
          path: .

      - name: Load scanned Docker image
        run: docker load --input devops-production-lab.tar

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image to GHCR
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-production-lab"

          docker tag "devops-production-lab:${GITHUB_SHA}" "${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "devops-production-lab:${GITHUB_SHA}" "${IMAGE_NAME}:latest"

          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"
